# Xcode project definition (xcodegen). The generated MoWalk.xcodeproj is committed,
# so you only need xcodegen if you change this file: `brew install xcodegen && xcodegen`.
# Signing team and bundle id are passed in by install.sh -- nothing personal lives here.
name: MoWalk
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MoWalk:
    type: application
    platform: iOS
    sources: [MoWalk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mowalk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: MoWalk/Info.plist
      properties:
        CFBundleDisplayName: Mo'Walk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take photos along the walk.
        NSMicrophoneUsageDescription: Record interviews with walkers.
        NSPhotoLibraryAddUsageDescription: Save a copy of walk photos to your library.
        NSLocationWhenInUseUsageDescription: Mo'Walk records your walk, tags photos and notes with where you were, and guides you along a route.
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPS track
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS track
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
